name: fallow mutation validation

on:
  pull_request:
  workflow_dispatch:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  fallow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fallow
        id: fallow
        uses: fallow-rs/fallow@feat/mutation-ci-surface
        with:
          comment: true
          mutation: true
          mutation-scope: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'changed' }}
          mutation-max-mutants: ${{ github.event_name == 'workflow_dispatch' && '25' || '' }}
          fail-on-issues: false
      - name: Show outputs
        if: always()
        env:
          OUTCOME: ${{ steps.fallow.outputs.mutation-outcome }}
          COMPLETION: ${{ steps.fallow.outputs.mutation-completion }}
          SCORE: ${{ steps.fallow.outputs.mutation-score }}
          RESULTS: ${{ steps.fallow.outputs.mutation-results }}
        run: printf 'outcome=%s completion=%s score=%s results=%s\n' "$OUTCOME" "$COMPLETION" "$SCORE" "$RESULTS"
